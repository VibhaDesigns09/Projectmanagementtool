<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Disease Desk</title>
<style>
/* Layout: navy top bar · Google-style search home · one-screen disease dashboard (12-col cards) · right detail drawer · floating assistant */
:root{
  --bar:#0B2447; --bar-ink:#FFFFFF; --bar-muted:#A9BCDA;
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#EDF1F7; --ink:#0C1A2E; --muted:#56667E; --line:#D8E0EB;
  --accent:#19376D; --accent-ink:#FFFFFF; --accent-soft:#E3EBF7; --link:#1C4A96;
  --good:#1D7650; --good-soft:#E2F2E9; --mid:#9A6110; --mid-soft:#FBF0DB; --bad:#AE3527; --bad-soft:#FAE7E3;
  --g-patient:#B4530A; --g-care:#1C4A96; --g-dx:#0E7068; --g-sys:#5B6B82;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(11,36,71,.06),0 6px 20px rgba(11,36,71,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bar:#081A35; --bar-ink:#FFFFFF; --bar-muted:#93A8C8;
  --bg:#07111F; --surface:#0E1B30; --sunk:#132440; --ink:#E6ECF5; --muted:#9AAAC0; --line:#22334E;
  --accent:#8EB2EC; --accent-ink:#071327; --accent-soft:#16294A; --link:#93B7F2;
  --good:#5CC497; --good-soft:#12301F; --mid:#E3B25C; --mid-soft:#33260E; --bad:#F08C7B; --bad-soft:#371A16;
  --g-patient:#F0A15B; --g-care:#8EB2EC; --g-dx:#4FC3B5; --g-sys:#9AAAC0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bar:#081A35; --bar-ink:#FFFFFF; --bar-muted:#93A8C8;
  --bg:#07111F; --surface:#0E1B30; --sunk:#132440; --ink:#E6ECF5; --muted:#9AAAC0; --line:#22334E;
  --accent:#8EB2EC; --accent-ink:#071327; --accent-soft:#16294A; --link:#93B7F2;
  --good:#5CC497; --good-soft:#12301F; --mid:#E3B25C; --mid-soft:#33260E; --bad:#F08C7B; --bad-soft:#371A16;
  --g-patient:#F0A15B; --g-care:#8EB2EC; --g-dx:#4FC3B5; --g-sys:#9AAAC0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:18px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.logo{background:none;border:0;color:var(--bar-ink);font:700 20px/1 var(--font);letter-spacing:-.01em;cursor:pointer;padding:0}
.logo span,.logo-lg span{color:#7FA8E8}
.bar .search{flex:1;min-width:220px;max-width:560px}
.barnav{margin-left:auto;display:flex;align-items:center;gap:14px}
.navlink{background:none;border:0;color:var(--bar-muted);font-weight:600;cursor:pointer;padding:4px 0}
.navlink:hover{color:var(--bar-ink)}
.badge-us{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 9px;color:var(--bar-ink)}
body.is-home .bar .search{visibility:hidden}
@media (max-width:640px){.bar .wrap{gap:10px;flex-wrap:nowrap}.logo{font-size:17px}.bar .search{min-width:0}.bar .search input{padding-right:12px}.bar .search button[type=submit]{display:none}.badge-us{display:none}.barnav{gap:8px}}

/* ---------- Search ---------- */
.search{position:relative;width:100%}
.search input{width:100%;font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:13px 104px 13px 44px;box-shadow:0 1px 6px rgba(11,36,71,.08)}
.search input:focus{outline:none;border-color:var(--link);box-shadow:0 2px 14px rgba(11,36,71,.18)}
.search>.i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button[type=submit]{position:absolute;right:5px;top:5px;bottom:5px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px;cursor:pointer}
.bar .search input{padding-block:9px;font-size:15px;border-color:transparent}
.bar .search button[type=submit]{background:#2C5AA0;color:#fff}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(11,36,71,.18);list-style:none;margin:0;padding:6px;z-index:35;max-height:360px;overflow:auto;text-align:left}
.suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--sunk)}
.suggest .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.suggest .cat .i{width:13px;height:13px}

/* ---------- Home ---------- */
#home{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding-block:40px}
.hero{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.logo-lg{font:700 clamp(44px,9vw,72px)/1 var(--font);letter-spacing:-.03em;color:var(--accent)}
.tagline{color:var(--muted);margin:-8px 0 0;font-size:15px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--link);color:var(--link)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.features{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-size:13px}
.features li{display:inline-flex;align-items:center;gap:6px}
.features .i{width:15px;height:15px;color:var(--accent)}

/* ---------- Disease dashboard ---------- */
#page{padding-block:18px 64px}
.notice{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:end;margin-bottom:14px}
.dhead h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.015em}
.aka{color:var(--muted);font-size:13.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn .i{width:16px;height:16px}
.metas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.meta{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meta .i{width:14px;height:14px}
.meta.good{border-color:transparent;background:var(--good-soft);color:var(--good)} .meta.good b{color:var(--good)}
.meta.warn{border-color:transparent;background:var(--mid-soft);color:var(--mid)} .meta.warn b{color:var(--mid)}
.meta.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)} .meta.bad b{color:var(--bad)}
.also{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}
.also .chip{font-size:12.5px;padding:3px 11px}

.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{grid-column:span 4;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--link);box-shadow:var(--shadow)}
.card.s3{grid-column:span 3}.card.s5{grid-column:span 5}.card.s6{grid-column:span 6}
@media (max-width:1060px){.card,.card.s3,.card.s5{grid-column:span 6}}
@media (max-width:680px){.card,.card.s3,.card.s5,.card.s6{grid-column:1/-1}.dhead{grid-template-columns:minmax(0,1fr)}.dactions{justify-content:flex-start}}
.card>header{display:flex;align-items:center;gap:8px}
.card>header .i{color:var(--accent)}
.card h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card>header .count{margin-left:auto;font-size:12px;color:var(--muted)}
.more{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:2px 0;color:var(--link);font-weight:600;font-size:12.5px;cursor:pointer}
.more .i{width:14px;height:14px}
.lede{margin:0;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rows li{display:flex;align-items:center;gap:8px;min-width:0}
.rows li>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .i{width:15px;height:15px;color:var(--muted)}
.rows span.ok{color:var(--good);font-weight:600}.rows span.warn{color:var(--mid);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sev-high{background:var(--bad)}.sev-med{background:var(--mid)}.sev-low{background:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--sunk);border-radius:8px;padding:7px 8px}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.ok b{color:var(--good)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.A{background:var(--good-soft);color:var(--good)}.pill.F{background:var(--accent-soft);color:var(--link)}
.pill.X{background:var(--mid-soft);color:var(--mid)}.pill.O{background:var(--mid-soft);color:var(--mid)}
.rows .pill{margin-left:auto}
.minij{position:relative;height:74px;margin-top:2px}
.minij svg{position:absolute;inset:10px 0 18px;width:100%;height:calc(100% - 28px);overflow:visible}
.minij .pt{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.minij .lbl{position:absolute;bottom:0;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;max-width:16%;overflow:hidden;text-overflow:ellipsis}
.painline{font-size:13px;display:flex;gap:6px;align-items:flex-start;color:var(--bad)}
.painline .i{width:15px;height:15px;margin-top:2px}
.painline b{color:var(--ink);font-weight:600}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:6px;padding:3px 8px;background:var(--sunk);color:var(--ink);max-width:100%}
.tag .i{width:13px;height:13px;color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--mid-soft);color:var(--mid)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tools{grid-template-columns:minmax(0,1fr)}}
.tool{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:10px;cursor:pointer}
.tool:hover{border-color:var(--link)}
.tool b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.tool b .i{color:var(--accent);width:16px;height:16px}
.tool span{font-size:12px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:16px;display:flex;gap:6px;align-items:center}
.foot .i{width:14px;height:14px}

/* ---------- Drawer ---------- */
.drawer{position:fixed;inset:0;z-index:40}
.drawer-backdrop{position:absolute;inset:0;background:rgba(5,14,30,.5)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(1100px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
.drawer-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px 0}
.drawer-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drawer-title h2{font-size:19px;font-weight:700}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--link);color:var(--link)}
.drawer-title .iconbtn{margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 11px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--link);border-bottom-color:var(--link)}
.drawer-body{flex:1;overflow:auto;padding:20px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.dsec{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.dsec>h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.dsec>h3 .i{width:15px;height:15px}
.dsec>p.sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.tile strong{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico .i{width:16px;height:16px}
.linklist{list-style:none;margin:0;padding:0}
.linklist a{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.linklist li:last-child a{border-bottom:0}
.linklist a:hover{text-decoration:none;color:var(--link)}
.linklist .t{flex:1;min-width:0}
.linklist small{display:block;color:var(--muted);font-size:12px}
.linklist .go{color:var(--muted);width:14px;height:14px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}

/* journey map (drawer) */
.jwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.jm{display:grid;grid-template-columns:170px repeat(var(--cols),minmax(124px,1fr));min-width:calc(170px + var(--cols) * 124px);font-size:13px}
.jm>div{padding:8px;border-bottom:1px solid var(--line);min-width:0}
.jm .rl{position:sticky;left:0;background:var(--surface);z-index:2;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.jm .rl .i{width:15px;height:15px}
.stage{display:flex;flex-direction:column;gap:5px}
.stage .ico{width:30px;height:30px;border-radius:50%}
.stage b{font-size:14px;line-height:1.15}
.time{font-size:11.5px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.time .i{width:12px;height:12px}
.jm ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:2px}
.feel{grid-column:2/-1;position:relative;height:210px;padding:0!important}
.feel svg{position:absolute;inset:24px 0 80px 0;width:100%;height:calc(100% - 104px);overflow:visible}
.band{position:absolute;left:4px;font-size:10.5px;color:var(--muted)}
.fdot{position:absolute;transform:translate(-50%,-15px);display:flex;flex-direction:column;align-items:center;gap:2px;width:120px;text-align:center}
.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--fc);color:var(--fc)}
.face .i{width:20px;height:20px}
.fdot b{font-size:12px;color:var(--fc);background:var(--surface);padding:0 4px;border-radius:4px}
.quote{position:absolute;bottom:4px;transform:translateX(-50%);width:124px;text-align:center;font-style:italic;color:var(--muted);font-size:12px;line-height:1.3}
.pain{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-size:12.5px;line-height:1.35}
.pain .i{width:15px;height:15px;margin-top:1px}
.grp{grid-column:1/-1;background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gc);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.legend{display:inline-flex;gap:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.who{font-size:13px!important;font-weight:600!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important}
.who .i{width:16px!important;height:16px!important;color:var(--gc)}
.who .cert{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-grid;place-items:center;border-radius:4px}
.who .cert:hover{color:var(--link);background:var(--accent-soft)}
.who .cert .i{width:14px!important;height:14px!important;color:inherit}
.cell{position:relative;display:grid;place-items:center}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--gc);opacity:.2}
.cell.edge-l::before{left:50%}.cell.edge-r::before{right:50%}.cell.none::before{display:none}
.mk{width:14px;height:14px;border-radius:50%;position:relative;z-index:1}
.mk.L{background:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 22%,transparent)}
.mk.S{background:var(--surface);border:2.5px solid var(--gc)}
.mk.lg{display:inline-block;width:10px;height:10px}
.g-patient{--gc:var(--g-patient)}.g-care{--gc:var(--g-care)}.g-dx{--gc:var(--g-dx)}.g-sys{--gc:var(--g-sys)}
.srcnote{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}

/* lists in drawer */
.inf{list-style:none;margin:0;padding:0}
.inf li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.inf li:last-child{border-bottom:0}
.inf .ico{grid-row:span 2}
.inf .top{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.inf strong{font-size:14px}
