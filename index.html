<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Disease Desk</title>
<style>
/* Layout: Google-style home · disease pages with a tab bar (name in a notch + icon pills) over one canvas, a tab per screen · bottom-centre dock (home, search, chat). One dark navy theme (#0F1A2B) with white text. */
:root{
  --bg:#0F1A2B; --panel:#1D2838; --cv:#17243A; --ink:#FFFFFF; --muted:#B4BFD3;
  --glass:rgba(255,255,255,.06); --glass-hover:rgba(255,255,255,.09);
  --surface:rgba(255,255,255,.06); --sunk:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.28);
  --bar:#0A1322; --bar-ink:#FFFFFF; --bar-muted:#AEB8D0;
  --accent:#9DB7F5; --accent-ink:#0F1A2B; --accent-soft:rgba(157,183,245,.16); --link:#B3C9FF;
  --good:#6FD6A8; --good-soft:rgba(111,214,168,.15); --mid:#F2C46B; --mid-soft:rgba(242,196,107,.15); --bad:#FF9E8C; --bad-soft:rgba(255,158,140,.15);
  --g-patient:#F5A65B; --g-care:#9DB7F5; --g-dx:#5FD3C6; --g-sys:#B7C0D6;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px; --shadow:0 2px 6px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
  --blur:blur(18px) saturate(140%);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}


/* ---------- Dock (disease pages): home, search, chat at bottom centre ---------- */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(15,26,43,.78);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dockbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.dockbtn:hover{background:var(--sunk)}
.dockbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.dockbtn .i{width:20px;height:20px}
body.is-home .dock .page-only,body:not(.is-home) .dock .home-only{display:none}
@media (max-width:1040px){body.chat-open .dock{display:none}}
.sheet{position:fixed;inset:0;z-index:55;display:flex;justify-content:center;align-items:flex-start;padding:16px;padding-top:calc(14vh + env(safe-area-inset-top,0px))}
.sheet-backdrop{position:absolute;inset:0;background:rgba(5,10,18,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-panel{position:relative;width:min(620px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet .search input{background:var(--panel)}

/* ---------- Search ---------- */
.search{position:relative;width:100%;margin:0}
.search input{width:100%;font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:13px 54px 13px 46px}
.search input::placeholder{color:var(--muted);opacity:1}
.search input:hover{border-color:var(--line-strong)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.i{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button[type=submit]{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.search button[type=submit]:hover{filter:brightness(1.08)}
.search button[type=submit] .i{width:18px;height:18px;stroke-width:2.2}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);list-style:none;margin:0;padding:6px;z-index:35;max-height:360px;overflow:auto;text-align:left}
.suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--sunk)}
.suggest .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.suggest .cat .i{width:13px;height:13px}
.suggest .sugfoot{display:flex;justify-content:center;gap:10px;padding:10px 6px 6px;margin-top:4px;border-top:1px solid var(--line)}
.suggest .sugfoot button{width:auto;display:inline-block;background:var(--sunk);color:var(--ink);border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
.suggest .sugfoot button:hover{background:var(--sunk);border-color:var(--line-strong)}

/* ---------- Home ---------- */
/* Home: small brand mark top-left, search top-centre, one headline at a time (swipe or tap the dots) */
#home{padding-block:20px 120px}
.hometop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,640px) minmax(0,1fr);align-items:center;gap:12px}
.brandmark{justify-self:start;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 13px/1 var(--font);display:flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer;padding:0}
.brandmark span{color:var(--accent)}
.brandmark:hover{border-color:var(--line-strong);background:var(--glass-hover)}
#homeForm{grid-column:2}
@media (max-width:760px){.hometop{grid-template-columns:auto minmax(0,1fr)}#homeForm{grid-column:auto}}
.news{width:100%;max-width:680px;margin:40px auto 0;display:flex;flex-direction:column;gap:12px}
.newshead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.newshead h2{font-size:14px;font-weight:600;color:var(--muted)}
.newsnote{font-size:12px;color:var(--muted)}
.slides{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:18px}
.slides::-webkit-scrollbar{display:none}
.slides:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;min-height:236px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.ntop{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.nkind{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent)}
.nkind .i{width:15px;height:15px}
.nkind.approval{color:var(--good)}.nkind.payment,.nkind.deal,.nkind.watch{color:var(--mid)}
.ntop time,.ntop .count{margin-left:auto;white-space:nowrap}
.slide h3{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.slide p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.nfoot{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.nfoot a,.nfoot button{display:inline-flex;align-items:center;gap:4px}
.nfoot .i{width:13px;height:13px}
.watchlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.watchlist li{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:14px}
.watchlist time{font-weight:700}
.watchlist b{font-weight:600}
.watchlist .wfor{display:block;color:var(--muted);font-size:12.5px}
.watchlist .wlinks{display:flex;gap:12px;font-size:12.5px;white-space:nowrap}
.watchlist .wlinks a,.watchlist .wlinks button{display:inline-flex;align-items:center;gap:3px}
.watchlist .wlinks .i{width:12px;height:12px}
.dots{display:flex;justify-content:center;gap:0}
.dotbtn{width:20px;height:20px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dotbtn span{width:6px;height:6px;border-radius:999px;background:var(--line-strong);transition:width .2s,background .2s}
.dotbtn[aria-selected="true"] span{width:18px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.dotbtn span{transition:none}}
@media (max-width:600px){.slide{padding:18px;min-height:260px}.slide h3{font-size:19px}.watchlist li{grid-template-columns:52px minmax(0,1fr)}.watchlist .wlinks{grid-column:2}}
.homebtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.hbtn{background:var(--sunk);color:var(--ink);border:1px solid transparent;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--line-strong)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--link);color:var(--link)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Pages: shared (directory, quick research) ---------- */
#page{padding-block:22px 104px}
.notice{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;margin-bottom:16px}
.dhead h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em}
.aka{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn:hover{border-color:var(--line-strong);background:var(--glass-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn .i{width:16px;height:16px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--link);color:var(--link)}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 4;position:relative;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card.s6{grid-column:span 6}
@media (max-width:680px){.card,.card.s6{grid-column:1/-1}}
.card>header{display:flex;align-items:center;gap:10px;min-width:0}
.cico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.cico .i{width:20px;height:20px}
.card h2{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico .i{width:16px;height:16px}
.linklist{list-style:none;margin:0;padding:0}
.linklist a{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.linklist li:last-child a{border-bottom:0}
.linklist a:hover{text-decoration:none;color:var(--link)}
.linklist .t{flex:1;min-width:0}
.linklist small{display:block;color:var(--muted);font-size:12px}
.linklist .go{color:var(--muted);width:14px;height:14px}
.none{margin:0;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.A{background:var(--good-soft);color:var(--good)}.pill.F{background:var(--accent-soft);color:var(--link)}
.pill.X,.pill.O{background:var(--mid-soft);color:var(--mid)}
.factlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px;line-height:1.45}
.factlist li{display:flex;gap:8px;align-items:flex-start}
.factlist .i{width:15px;height:15px;color:var(--accent);margin-top:1px;flex:none}
.req{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:12.5px;line-height:1.45}
.req dt{font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.req dd{margin:0}
.verify{display:flex;flex-wrap:wrap;gap:6px}
.verify a{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.g-patient{--gc:var(--g-patient)}.g-care{--gc:var(--g-care)}.g-dx{--gc:var(--g-dx)}.g-sys{--gc:var(--g-sys)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wchip{flex:none;display:inline-flex;align-items:center;gap:5px;max-width:170px;height:26px;border-radius:999px;padding:0 10px 0 3px;font-size:12px;border:1px solid transparent;background:color-mix(in srgb,var(--gc) 17%,transparent);color:var(--ink);cursor:pointer;white-space:nowrap}
.wchip>span:last-child{overflow:hidden;text-overflow:ellipsis}
.wi{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--gc);color:var(--bg)}
.wi .i{width:12px;height:12px}
.wchip.S{background:transparent;border-color:color-mix(in srgb,var(--gc) 50%,transparent)}
.wchip.S .wi{background:color-mix(in srgb,var(--gc) 18%,transparent);color:var(--gc)}
.wchip:hover{border-color:var(--gc)}
.wmore{flex:none;height:26px;border:1px solid var(--line);background:none;border-radius:999px;padding:0 9px;font-size:12px;color:var(--muted);cursor:pointer}
.wmore:hover{color:var(--ink);border-color:var(--line-strong)}
.tog{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.tog:hover{background:var(--sunk);border-color:var(--line-strong)}
.tog .i{width:16px;height:16px}

/* ---------- Disease page: tab bar (name in a notch + icon pills, after the reference), one canvas; each tab fits one screen ---------- */
#page.dzpage{max-width:1440px;padding:0 16px}
.dz{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 0 calc(76px + env(safe-area-inset-bottom,0px))}
.dzbar{display:flex;align-items:flex-end;min-width:0}
.notch{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0;max-width:44%;background:var(--cv);border-radius:24px 24px 0 0;padding:11px 20px 9px 11px}
.notch::after{content:"";position:absolute;left:100%;bottom:0;width:24px;height:24px;background:radial-gradient(circle at 100% 0,transparent 23.5px,var(--cv) 24px)}
.xbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.xbtn:hover{background:rgba(255,255,255,.08)}
.xbtn .i{width:16px;height:16px}
.notch h1{font-size:clamp(20px,2.1vw,28px);font-weight:500;letter-spacing:-.02em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.notch h1.long{font-size:clamp(18px,1.7vw,23px)}
.notch h1.xlong{font-size:clamp(16px,1.35vw,19px)}
.ptabs{flex:1 1 auto;min-width:0;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:6px 2px 11px 34px}
.ptabs::-webkit-scrollbar{display:none}
.ptabs::before{content:"";flex:1 0 0}
.ptab{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#DCE3EF;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.ptab .i{width:16px;height:16px;color:var(--muted);transition:color .15s}
.ptab:hover{background:rgba(255,255,255,.11);color:#fff}
.ptab[aria-selected="true"]{background:#fff;border-color:#fff;color:var(--bg);font-weight:600;box-shadow:0 0 0 3px rgba(157,183,245,.28)}
.ptab[aria-selected="true"] .i{color:var(--bg)}
.canvas{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;background:var(--cv);border-radius:0 24px 24px 24px;padding:16px 18px 18px}
.match{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--muted)}
.match .i{width:14px;height:14px}
.match b{color:var(--ink)}
.match .chip{font-size:12px;padding:3px 10px}
.vitals{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 36px;padding:0 4px}
.vit{display:flex;flex-direction:column;gap:3px;min-width:0}
.vit>span{font-size:11.5px;color:var(--muted)}
.vit b{display:flex;align-items:baseline;gap:4px;font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.vit b small{font-size:12px;font-weight:400;color:var(--muted)}
.vit.vcat b{align-items:center;gap:7px;font-size:17px;font-weight:600}
.vit.vcat .i{width:18px;height:18px;color:var(--accent)}
.pane{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;outline:none;scrollbar-width:thin;margin:0 -6px;padding:2px 6px}
.cc{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px 16px;min-width:0}
.cch{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.cch h2{flex:1;min-width:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cch .count{font-size:12px;color:var(--muted);white-space:nowrap}
.ccico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);color:var(--ink)}
.ccico .i{width:15px;height:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill2{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer}
.pill2 span{font-size:11.5px;color:var(--muted)}
.pill2:hover{background:rgba(255,255,255,.07)}
.pill2[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--bg);font-weight:600}
.pill2[aria-pressed="true"] span{color:#56667E}

/* About */
.about{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.brief .lead{margin:2px 0 12px;font-size:clamp(17px,1.5vw,20px);line-height:1.45;font-weight:500;letter-spacing:-.005em}
.facts{list-style:none;margin:0;padding:0}
.facts li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.fico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.fico .i{width:17px;height:17px}
.facts em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.facts div>span{font-size:13.5px;line-height:1.45}
.aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.rlist{list-style:none;margin:0;padding:0}
.rlist a,.rlist .nolink{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);color:var(--ink);font-size:13px;min-width:0}
.rlist li:first-child a,.rlist li:first-child .nolink{border-top:0;padding-top:0}
.rlist a:hover{text-decoration:none;color:var(--link)}
.rico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);color:var(--muted)}
.rico .i{width:14px;height:14px}
.rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--muted);font-size:11.5px;margin-left:7px}
.rgo{width:13px;height:13px;color:var(--muted)}
.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vid{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);font-size:12.5px;line-height:1.3;min-width:0}
.vid:hover{text-decoration:none;border-color:var(--link)}
.vid .i{color:var(--bad);width:16px;height:16px}
.vid small{display:block;color:var(--muted);font-size:11px}

/* Causes & journey */
.jr{display:flex;flex-direction:column;gap:14px}
.causes{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 16px}
.cl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex:none}
.cl .i{width:17px;height:17px;color:var(--accent)}
.cchips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cchip{font-size:12.5px;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.tlc{padding-bottom:16px}
.tl{--p:0%;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));row-gap:14px;margin-top:4px}
.rail{position:absolute;top:18px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:2px;border-radius:2px;background:rgba(255,255,255,.14)}
.railfill{position:absolute;left:0;top:0;bottom:0;width:var(--p);border-radius:2px;background:var(--accent)}
.mk{grid-row:1;grid-column:calc(var(--i) + 1);justify-self:center;position:relative;z-index:1;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:var(--cv);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .3s,border-color .3s,color .3s,box-shadow .3s}
.mk>.i{width:17px;height:17px}
.mk:hover{border-color:var(--accent)}
.mk.done{border-color:var(--accent);color:var(--ink)}
.mk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.mface{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;display:none;place-items:center;background:var(--cv);color:var(--fc);border:1.5px solid var(--fc)}
.mk.done .mface{display:grid}
.mface .i{width:13px;height:13px}
.scard{grid-row:2;grid-column:calc(var(--i) + 1);position:relative;margin:0 5px;display:flex;flex-direction:column;gap:7px;min-width:0;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:opacity .4s,border-color .3s,background .3s,transform .3s}
.scard:hover{border-color:var(--line-strong)}
.stem{position:absolute;left:50%;top:-15px;width:2px;height:14px;margin-left:-1px;background:rgba(255,255,255,.14)}
.scard.done .stem,.scard.on .stem{background:var(--accent)}
.scard.on{border-color:var(--accent);background:rgba(157,183,245,.09);transform:translateY(-2px)}
.tl.playing .scard:not(.done):not(.on){opacity:.45}
.scard header{display:flex;flex-direction:column;gap:2px;min-width:0}
.scard header b{font-size:13.5px;line-height:1.25}
.stime{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.stime .i{width:11px;height:11px}
.sfeel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--fc)}
.sfeel .i{width:15px;height:15px}
.meter{display:inline-flex;gap:2px;margin-left:auto}
.meter i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16)}
.meter i.on{background:var(--fc)}
.swhat{margin:0;font-size:12px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spain{margin:0;display:flex;gap:5px;align-items:flex-start;font-size:12px;line-height:1.35;color:var(--bad)}
.spain .i{width:13px;height:13px;margin-top:1px;flex:none}
.swho{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px}
.swho .wchip{max-width:100%;height:24px;font-size:11.5px}
.swho .wmore{height:24px}

/* US patients */
.usp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px}
.bignum{font-size:clamp(28px,3.3vw,42px);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.bigsub{margin:4px 0 0;font-size:13.5px}
.ratio{display:inline-block;margin:12px 0 0;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 11px}
.src{display:flex;gap:6px;align-items:flex-start;margin:12px 0 0;font-size:11.5px;color:var(--muted)}
.src .i{width:13px;height:13px;margin-top:1px;flex:none}
.gauge{padding:24px 4px 0}
.gtrack{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,rgba(111,214,168,.25),rgba(157,183,245,.18) 70%,rgba(242,196,107,.25))}
.grange{position:absolute;top:-3px;bottom:-3px;left:var(--a);right:calc(100% - var(--b));min-width:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gthr{position:absolute;top:-10px;bottom:-10px;left:var(--x);width:2px;margin-left:-1px;background:var(--mid)}
.gthr span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:11px;font-weight:700;color:var(--mid);white-space:nowrap}
.gticks{position:relative;height:18px;margin-top:10px}
.gticks span{position:absolute;left:var(--x);transform:translateX(-50%);font-size:11px;color:var(--muted)}
.gticks span:first-child{transform:none}.gticks span:last-child{transform:translateX(-100%)}
.verdict{margin:6px 0 0;font-size:15px;font-weight:600}
.verdict.rare{color:var(--good)}.verdict.above,.verdict.border,.verdict.common{color:var(--mid)}
.fine{margin:8px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.usstats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ustat{position:relative;display:flex;flex-direction:column;gap:3px}
.ustat .ccico{position:absolute;top:12px;right:12px}
.ustat em{font-style:normal;font-size:11.5px;color:var(--muted)}
.ustat b{font-size:17px;font-weight:600;line-height:1.25;padding-right:34px}
.ustat>span:last-child{font-size:12px;color:var(--muted);line-height:1.4}

/* Stakeholder map */
.smap{display:flex;flex-direction:column;height:100%;min-height:0}
.smbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:14px;align-items:start}
.smgrid,.smdetail{max-height:100%;overflow:auto;scrollbar-width:thin}
.smgrid{padding:12px 10px 10px}
.mg{display:flex;flex-direction:column;gap:1px}
.mgh,.mgr{display:grid;grid-template-columns:minmax(150px,230px) repeat(var(--n),minmax(0,1fr));align-items:center}
.mgh{font-size:11px;color:var(--muted);padding:0 8px 7px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.mgh span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.mgh span:first-child{text-align:left;padding:0}
.mgr{width:100%;border:0;background:none;color:var(--ink);padding:5px 8px;border-radius:10px;cursor:pointer;text-align:left;font-size:12.5px;min-height:31px}
.mgr:hover{background:rgba(255,255,255,.05)}
.mgr[aria-pressed="true"]{background:rgba(157,183,245,.12);box-shadow:inset 0 0 0 1px rgba(157,183,245,.35)}
.mgn{display:flex;align-items:center;gap:8px;min-width:0}
.mgn .i{width:15px;height:15px;color:var(--gc);flex:none}
.mgn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgc{grid-column:2/-1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:center;height:20px}
.mspan{grid-row:1;grid-column:calc(var(--a) + 1)/calc(var(--b) + 2);height:2px;margin-inline:calc(50% / (var(--b) - var(--a) + 1));background:var(--gc);opacity:.35;border-radius:2px}
.mdot{grid-row:1;grid-column:calc(var(--i) + 1);justify-self:center;display:inline-block;width:12px;height:12px;border-radius:50%;position:relative;z-index:1}
.mdot.L{background:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 25%,transparent)}
.mdot.S{background:var(--cv);border:2px solid var(--gc)}
.mglegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;padding:8px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.mglegend span{display:inline-flex;align-items:center;gap:6px}
.mglegend .mdot{--gc:var(--accent)}
.smgrid.is-access .mg,.smgrid.is-access .mglegend{display:none}
.smgrid:not(.is-access) .acc{display:none}
.acc{list-style:none;margin:0;padding:0 4px}
.acc li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.acc li:first-child{border-top:0;padding-top:2px}
.acc b{font-size:13.5px;margin-right:8px}
.lever{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--link);border-radius:4px;padding:2px 6px;white-space:nowrap}
.acc p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.acc p em{font-style:normal;color:var(--ink);font-weight:600}
.smdetail{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.pdh{display:flex;gap:12px;align-items:center}
.pico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--gc,var(--accent)) 18%,transparent);color:var(--gc,var(--accent))}
.pico .i{width:20px;height:20px}
.pdh b{display:block;font-size:15px;line-height:1.3}
.pdh small{font-size:12px;color:var(--muted)}
.prole{margin:0;font-size:13px;line-height:1.45}
.pst{display:flex;flex-direction:column;gap:5px}
.pst em{font-style:normal;font-size:11.5px;color:var(--muted)}
.pst div{display:flex;flex-wrap:wrap;gap:4px}
.pst span{font-size:11.5px;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.07);color:var(--muted)}
.pst span.L{background:var(--good-soft);color:var(--good)}
.pcred{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.pcred h3{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pcred h3 .i{width:15px;height:15px}
.smdetail .btn{align-self:flex-start;margin-top:2px}

/* Gaps & needs */
.gapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:8px}
.gcard header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--muted)}
.gico.high{background:var(--bad-soft);color:var(--bad)}.gico.med{background:var(--mid-soft);color:var(--mid)}
.gico .i{width:17px;height:17px}
.sev{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.06);color:var(--muted)}
.sev.high{color:var(--bad);background:var(--bad-soft)}.sev.med{color:var(--mid);background:var(--mid-soft)}
.gcard h3{font-size:14.5px;font-weight:600;line-height:1.3}
.gcard p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.owners{margin-top:auto;display:flex;flex-direction:column;gap:5px;padding-top:8px;border-top:1px solid var(--line)}
.owners em{font-style:normal;font-size:11px;color:var(--muted)}
.owners div{display:flex;flex-wrap:wrap;gap:4px}
.owners span{font-size:11.5px;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.07)}

/* Innovation */
.inn{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.pcols{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pcols::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:2px;background:linear-gradient(90deg,rgba(157,183,245,.4),var(--good))}
.pcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.pcol h3{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.pcol h3 b{color:var(--ink);margin-left:3px}
.pmk{width:28px;height:28px;border-radius:50%;background:var(--cv);border:2px solid var(--accent);position:relative;z-index:1}
.pcol:last-child .pmk{border-color:var(--good);background:var(--good)}
.drug{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;min-width:0}
.drug b{display:block;font-size:13px;line-height:1.3}
.drug small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.drug p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35}
.drug.sA{border-color:rgba(111,214,168,.45)}.drug.sF{border-color:rgba(157,183,245,.5)}
.pcol .none{text-align:center;font-size:12px}
.pcol.folded .drug:nth-of-type(n+6){display:none}
.colist.folded li:nth-child(n+7){display:none}
.colist+.pmore{margin-top:6px}
.pmore{align-self:center;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.pmore:hover{color:var(--ink);border-color:var(--line-strong)}
.mg.dense .mgr{min-height:24px;padding-block:1px;font-size:12px}
.mg.dense .mdot{width:10px;height:10px}
.pother{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.pother>span{display:inline-flex;align-items:center;gap:6px}
.innside{display:flex;flex-direction:column;gap:14px;min-width:0}
.colist{list-style:none;margin:0;padding:0}
.colist li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
.colist li:first-child{border-top:0;padding-top:0}
.cotype{font-size:11px;color:var(--muted);white-space:nowrap}
.orgs{display:flex;gap:6px;align-items:flex-start;margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.orgs .i{width:14px;height:14px;flex:none;margin-top:1px}

/* Shorter laptop windows: tighter spacing so each tab still fits one screen */
@media (min-width:861px) and (max-height:820px){
  .dz{padding-top:8px;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .notch{padding:8px 18px 7px 9px}
  .xbtn{width:34px;height:34px}
  .notch h1{font-size:clamp(19px,1.9vw,24px)}
  .notch h1.long{font-size:clamp(17px,1.6vw,21px)}
  .notch h1.xlong{font-size:clamp(15px,1.3vw,18px)}
  .ptabs{padding-bottom:8px}
  .ptab{height:33px;font-size:12.5px;padding:0 12px 0 9px}
  .canvas{padding:12px 14px 14px;gap:10px}
  .vitals{gap:6px 28px}
  .vit>span{font-size:11px}
  .vit b{font-size:18px}
  .vit.vcat b{font-size:15px}
  .cc{padding:11px 14px;border-radius:16px}
  .cch{margin-bottom:7px}
  .ccico{width:26px;height:26px}
  .about,.usp,.inn,.smbody,.jr,.aside,.innside,.usstats,.gapgrid{gap:10px}
  .brief .lead{font-size:17px;margin-bottom:8px}
  .facts li{padding:7px 0}
  .fico{width:30px;height:30px}
  .factlist{gap:4px}
  .rlist a,.rlist .nolink,.colist li{padding:4px 0}
  .rico{width:24px;height:24px}
  .vid{padding:6px 9px}
  .pills{margin-bottom:8px}
  .pill2{height:29px}
  .mgr{min-height:26px;padding:2px 8px}
  .mgh{padding-bottom:5px}
  .mglegend{margin-top:5px;padding-top:6px}
  .causes{padding:9px 14px}
  .tl{row-gap:12px}
  .scard{padding:10px;gap:5px}
  .bignum{font-size:34px}
  .gauge{padding-top:20px}
  .ustat b{font-size:15px}
  .drug{padding:7px 10px}
  .drug p{display:none}
  .drug b,.drug small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .whead{padding:10px 16px 8px}
  .whead h2{font-size:15.5px}
  .wbody{padding:10px 16px}
  .wfoot{padding:8px 16px}
}
/* Very short windows: drop the key-numbers row (the same figures are on US patients and Innovation) */
@media (min-width:861px) and (max-height:680px){
  .vitals{display:none}
  .brief .lead{font-size:15.5px}
  .facts li{padding:5px 0}
  .facts div>span{font-size:12.5px}
  .bignum{font-size:28px}
  .ratio,.src{margin-top:8px}
  .gauge{padding-top:16px}
  .fine{display:none}
  .ustat>span:last-child{display:none}
  .gcard{gap:5px;padding:10px 12px}
  .gcard h3{font-size:13.5px}
  .gcard p{font-size:12px}
  .owners{padding-top:5px}
  .swhat{-webkit-line-clamp:2}
  .scard{gap:4px}
}
/* Narrow screens: tabs move under the name; panes stack; the page scrolls */
@media (max-width:860px){
  .dz{height:auto;min-height:100dvh}
  .dzbar{flex-direction:column;align-items:stretch}
  .notch{max-width:none;border-radius:20px 20px 0 0}
  .notch::after{display:none}
  .ptabs{background:var(--cv);padding:2px 12px 8px}
  .ptabs::before{display:none}
  .canvas{border-radius:0 0 20px 20px;padding:12px}
  .pane{overflow:visible}
  .vitals{gap:10px 22px}
  .vit b{font-size:19px}
  .about,.usp,.inn,.smbody{grid-template-columns:minmax(0,1fr)}
  .usstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .smdetail{position:static}
  .smap{height:auto}
  .smgrid,.smdetail{max-height:none;overflow:visible}
  .tl{grid-template-columns:44px minmax(0,1fr);row-gap:10px}
  .rail{top:20px;bottom:20px;left:21px;right:auto;width:2px;height:auto}
  .railfill{width:100%;height:var(--p);bottom:auto}
  .mk{grid-row:calc(var(--i) + 1);grid-column:1;align-self:start}
  .scard{grid-row:calc(var(--i) + 1);grid-column:2;margin:0}
  .stem{left:-9px;top:19px;width:8px;height:2px;margin:0}
  .pcols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pcols::before{display:none}
}
@media (max-width:520px){.mgh,.mgr{grid-template-columns:minmax(110px,1fr) repeat(var(--n),minmax(0,26px))}.videos{grid-template-columns:minmax(0,1fr)}}

/* ---------- Screener builder: step-by-step ---------- */
.pane.p-screener{overflow:hidden}
.scrmount{height:100%}
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;height:100%;min-height:0}
.i.flip{transform:scaleX(-1)}
.wsteps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.wst{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);text-align:left;cursor:pointer}
.wst:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.wst[aria-current="step"]{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:var(--ink)}
.wn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700;border:1.5px solid var(--line-strong)}
.wst.done .wn{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

    <button class="iconbtn" type="button" id="chatClear" aria-label="Clear conversation" title="Clear conversation"><span data-i="cycle"></span></button>
    <button class="iconbtn" type="button" id="chatClose" aria-label="Close assistant"><span data-i="close"></span></button>
  </div>
  <div class="chat-log" id="chatLog" aria-live="polite"></div>

    <span class="attach" id="chatAttach" hidden></span>

    <button class="btn primary" type="submit" id="chatSend"><span data-i="send"></span>Send</button>
    <button class="btn" type="button" id="chatStop" hidden>Stop</button>
  </form>
</section>
