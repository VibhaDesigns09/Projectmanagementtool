<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Disease Desk</title>
<style>
/* Layout: Google-style home · disease dashboard of translucent cards (12-col) · bottom-centre dock (home, search, chat) · right detail drawer. One deep-slate theme (#202A44) with white text. */
:root{
  --bg:#202A44; --panel:#2C364E; --ink:#FFFFFF; --muted:#B7C0D6;
  --glass:rgba(255,255,255,.055); --glass-hover:rgba(255,255,255,.085);
  --surface:rgba(255,255,255,.055); --sunk:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.28);
  --bar:#1A2238; --bar-ink:#FFFFFF; --bar-muted:#AEB8D0;
  --accent:#9DB7F5; --accent-ink:#202A44; --accent-soft:rgba(157,183,245,.16); --link:#B3C9FF;
  --good:#6FD6A8; --good-soft:rgba(111,214,168,.15); --mid:#F2C46B; --mid-soft:rgba(242,196,107,.15); --bad:#FF9E8C; --bad-soft:rgba(255,158,140,.15);
  --g-patient:#F5A65B; --g-care:#9DB7F5; --g-dx:#5FD3C6; --g-sys:#B7C0D6;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px; --shadow:0 2px 6px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
  --blur:blur(18px) saturate(140%);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

.logo-lg span{color:var(--accent)}

/* ---------- Dock (disease pages): home, search, chat at bottom centre ---------- */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(32,42,68,.7);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dockbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.dockbtn:hover{background:var(--sunk)}
.dockbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.dockbtn .i{width:20px;height:20px}
@media (max-width:1040px){body.chat-open .dock{display:none}}
.sheet{position:fixed;inset:0;z-index:55;display:flex;justify-content:center;align-items:flex-start;padding:16px;padding-top:calc(14vh + env(safe-area-inset-top,0px))}
.sheet-backdrop{position:absolute;inset:0;background:rgba(14,19,33,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-panel{position:relative;width:min(620px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet .search input{background:var(--panel)}

/* ---------- Search ---------- */
.search{position:relative;width:100%;margin:0}
.search input{width:100%;font:16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:13px 54px 13px 46px}
.search input::placeholder{color:var(--muted);opacity:1}
.search input:hover{border-color:var(--line-strong)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.i{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button[type=submit]{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.search button[type=submit]:hover{filter:brightness(1.08)}
.search button[type=submit] .i{width:18px;height:18px;stroke-width:2.2}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);list-style:none;margin:0;padding:6px;z-index:35;max-height:360px;overflow:auto;text-align:left}
.suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--sunk)}
.suggest .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.suggest .cat .i{width:13px;height:13px}
.suggest .sugfoot{display:flex;justify-content:center;gap:10px;padding:10px 6px 6px;margin-top:4px;border-top:1px solid var(--line)}
.suggest .sugfoot button{width:auto;display:inline-block;background:var(--sunk);color:var(--ink);border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px}
.suggest .sugfoot button:hover{background:var(--sunk);border-color:var(--line-strong)}

/* ---------- Home ---------- */
#home{padding-block:44px 120px}
.homewrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#homeForm{max-width:640px}
.news{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:12px}
.newshead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.newshead h2{font-size:17px;font-weight:600}
.watchhead{margin-top:14px}
.newsnote{font-size:12px;color:var(--muted)}
.newsgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.watchgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1060px){.newsgrid,.watchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.newsgrid,.watchgrid{grid-template-columns:minmax(0,1fr)}}
.ncard{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.ntop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.nkind{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent)}
.nkind .i{width:15px;height:15px}
.nkind.approval{color:var(--good)}.nkind.payment,.nkind.deal{color:var(--mid)}
.ntop time{margin-left:auto;white-space:nowrap}
.ncard h3{font-size:15px;font-weight:600;line-height:1.3}
.ncard p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.nfoot{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.nfoot a,.nfoot button{display:inline-flex;align-items:center;gap:4px}
.nfoot .i{width:13px;height:13px}
.wcard{gap:6px}
.wdate{font-size:20px;font-weight:700;line-height:1.1}
.wdrug{font-size:14px;font-weight:600}
.wfor{font-size:12.5px;color:var(--muted)}
body.is-home .dock .page-only,body:not(.is-home) .dock .home-only{display:none}
.logo-lg{margin:0;font:700 64px/1 var(--font);letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.tagline{color:var(--muted);margin:-6px 0 8px;font-size:17px}
.homebtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.hbtn{background:var(--sunk);color:var(--ink);border:1px solid transparent;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--line-strong)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--link);color:var(--link)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Disease dashboard ---------- */
#page{padding-block:22px 104px}
.notice{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center;margin-bottom:16px}
.dtitle{display:flex;align-items:center;gap:14px;min-width:0}
.catico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--line);color:var(--accent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.catico .i{width:28px;height:28px;stroke-width:1.6}
.dname{min-width:0}
.dhead h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em}
.aka{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn:hover{border-color:var(--line-strong);background:var(--glass-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn .i{width:16px;height:16px}
.metas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.meta{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink)}
.meta .i{width:14px;height:14px;color:var(--muted)}
.meta.good{border-color:transparent;background:var(--good-soft);color:var(--good)} .meta.good .i{color:var(--good)}
.meta.warn{border-color:transparent;background:var(--mid-soft);color:var(--mid)} .meta.warn .i{color:var(--mid)}
.meta.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)} .meta.bad .i{color:var(--bad)}
.also{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}
.also .chip{font-size:12.5px;padding:3px 11px}

.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 4;position:relative;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;cursor:pointer;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .15s,background .15s}
.card:hover{background:var(--glass-hover);border-color:var(--line-strong)}
.card.static{cursor:default}
.card.static:hover{background:var(--glass);border-color:var(--line)}
.card.s3{grid-column:span 3}.card.s5{grid-column:span 5}.card.s6{grid-column:span 6}
@media (max-width:1060px){.card,.card.s3,.card.s5{grid-column:span 6}}
@media (max-width:680px){.card,.card.s3,.card.s5,.card.s6{grid-column:1/-1}.dhead{grid-template-columns:minmax(0,1fr)}.dactions{justify-content:flex-start}}
/* Dashboard: left = About and Patient journey (same wide size) + three square tiles; right = one tall panel (gaps · companies · drugs in development) */
.dash2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:stretch}
.dleft{display:flex;flex-direction:column;gap:14px;min-width:0}
.dpair{display:grid;grid-auto-rows:1fr;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{aspect-ratio:1;width:100%;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;padding:16px;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:16px;color:var(--ink);cursor:pointer;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .15s,background .15s}
.tile:hover{background:var(--glass-hover);border-color:var(--line-strong)}
.tico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:auto}
.tico .i{width:26px;height:26px}
.ttl{font-size:15px;font-weight:600;line-height:1.25}
.tsub{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.tall{grid-column:auto;cursor:default;gap:0;padding:4px 16px}
.card.tall:hover{background:var(--glass);border-color:var(--line)}
.tsec{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 0;cursor:pointer;min-width:0}
.tsec+.tsec{border-top:1px solid var(--line)}
.tsec>header{display:flex;align-items:center;gap:10px;min-width:0}
.tsec h2{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsec>header .count{font-size:12px;color:var(--muted)}
.tsec:hover .go{color:var(--ink);background:var(--sunk)}
.rows .sub2{margin-left:auto;color:var(--muted);font-size:12px;flex:0 1 auto;max-width:55%}
.none{margin:0;font-size:12.5px;color:var(--muted)}
@media (max-width:1060px){.dash2{grid-template-columns:minmax(0,1fr)}.card.tall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px}.tsec+.tsec{border-top:0}}
@media (max-width:680px){.card.tall{display:flex}.tsec+.tsec{border-top:1px solid var(--line)}}
@media (max-width:520px){.tile{padding:12px}.tico{width:40px;height:40px}.tico .i{width:22px;height:22px}.ttl{font-size:13px}.tsub{display:none}}
.card>header{display:flex;align-items:center;gap:10px;min-width:0}
.cico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.cico .i{width:20px;height:20px}
.card h2{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card>header .count{font-size:12px;color:var(--muted);white-space:nowrap}
.go{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.card:hover .go,.go:focus-visible{color:var(--ink);background:var(--sunk)}
.go .i{width:16px;height:16px}
.lede{margin:0;font-size:13px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.rows li{display:flex;align-items:center;gap:9px;min-width:0}
.rows li>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .i{width:15px;height:15px;color:var(--muted)}
.rows span.ok{color:var(--good);font-weight:600}.rows span.warn{color:var(--mid);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sev-high{background:var(--bad)}.sev-med{background:var(--mid)}.sev-low{background:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--sunk);border-radius:10px;padding:8px 3px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.1}
.stat span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.ok b{color:var(--good)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.A{background:var(--good-soft);color:var(--good)}.pill.F{background:var(--accent-soft);color:var(--link)}
.pill.X{background:var(--mid-soft);color:var(--mid)}.pill.O{background:var(--mid-soft);color:var(--mid)}
.rows .pill{margin-left:auto}
.minij{position:relative;height:66px;margin-top:0}
.minij svg{position:absolute;inset:10px 0 18px;width:100%;height:calc(100% - 28px);overflow:visible}
.minij .pt{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.minij .lbl{position:absolute;bottom:0;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;max-width:16%;overflow:hidden;text-overflow:ellipsis}
.painline{margin:0;font-size:12.5px;display:flex;gap:6px;align-items:center;color:var(--muted);min-width:0}
.painline .i{width:15px;height:15px;color:var(--bad);flex:none}
.painline span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.painline b{color:var(--ink);font-weight:600}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .i{width:13px;height:13px;color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--mid-soft);color:var(--mid)}
.foot{color:var(--muted);font-size:11.5px;margin-top:18px;display:flex;gap:6px;align-items:center}
.foot .i{width:13px;height:13px}

/* ---------- Drawer ---------- */
.drawer{position:fixed;inset:0;z-index:40}
.drawer-backdrop{position:absolute;inset:0;background:rgba(2,8,20,.6)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(1100px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.4);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.drawer-head{background:rgba(26,34,56,.55);border-bottom:1px solid var(--line);padding:12px 20px 0}
.drawer-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drawer-title h2{font-size:19px;font-weight:700}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--link);color:var(--link)}
.drawer-title .iconbtn{margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 11px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--link);border-bottom-color:var(--link)}
.drawer-body{flex:1;overflow:auto;padding:20px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.dsec{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.dsec>h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.dsec>h3 .i{width:15px;height:15px}
.dsec>p.sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.tile strong{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico .i{width:16px;height:16px}
.linklist{list-style:none;margin:0;padding:0}
.linklist a{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.linklist li:last-child a{border-bottom:0}
.linklist a:hover{text-decoration:none;color:var(--link)}
.linklist .t{flex:1;min-width:0}
.linklist small{display:block;color:var(--muted);font-size:12px}
.linklist .go{color:var(--muted);width:14px;height:14px}
