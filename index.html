<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Disease Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: search-first home → results stack: 01 About (full) · 02 Journey + stakeholder map (full) · 03 Access | 04 Innovations · Gaps · Companies */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eef1f5; --ink:#15202b; --muted:#5d6b79; --line:#dbe1e8;
  --accent:#1f5f8b; --accent-soft:#e2edf6;
  --q1:#1f5f8b; --q2:#7a4e9c; --q3:#2b7a5a; --q4:#b0602a;
  --good:#2b7a5a; --mid:#c08a1e; --bad:#b3412b; --bad-soft:#fbe9e4;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#161e27; --sunk:#1c2631; --ink:#e4eaf0; --muted:#97a5b3; --line:#283441;
  --accent:#6fb1e0; --accent-soft:#1a2d3c;
  --q1:#6fb1e0; --q2:#bc95dd; --q3:#6cc39d; --q4:#e59a64;
  --good:#6cc39d; --mid:#e2b552; --bad:#ef8f78; --bad-soft:#2f1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#161e27; --sunk:#1c2631; --ink:#e4eaf0; --muted:#97a5b3; --line:#283441;
  --accent:#6fb1e0; --accent-soft:#1a2d3c;
  --q1:#6fb1e0; --q2:#bc95dd; --q3:#6cc39d; --q4:#e59a64;
  --good:#6cc39d; --mid:#e2b552; --bad:#ef8f78; --bad-soft:#2f1d19; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);margin:0;padding-inline:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Home ---------- */
#home{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-block:48px}
.brand{font:700 clamp(40px,8vw,68px)/1 var(--display);letter-spacing:-.02em}
.brand span{color:var(--accent)}
.tag{color:var(--muted);margin-top:-12px;text-align:center;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tag span{display:inline-flex;align-items:center;gap:6px}
.tag .i{width:16px;height:16px}
.search{width:100%;max-width:620px;position:relative}
.search input{width:100%;font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:15px 112px 15px 48px;box-shadow:0 1px 6px rgba(20,40,60,.08)}
.search input:hover,.search input:focus{box-shadow:0 2px 12px rgba(20,40,60,.16);outline:none;border-color:var(--accent)}
.search>.i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search button{position:absolute;right:6px;top:6px;bottom:6px;border:0;border-radius:999px;background:var(--accent);color:var(--surface);font:600 14px var(--body);padding:0 20px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:14px var(--body);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip small{color:var(--good);margin-left:6px;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* ---------- Results shell ---------- */
#results{max-width:1240px;margin:0 auto;padding-block:16px 56px}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:8px 16px;border-bottom:1px solid var(--line)}
.topbar .brand{font-size:24px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.topbar .search{flex:1;min-width:240px;max-width:560px}
.topbar .search input{padding-block:10px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:22px 16px}
.head h1{font-size:clamp(28px,4.4vw,40px)}
.head .aka{color:var(--muted);margin-top:4px}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.code{font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface);color:var(--muted)}
.code b{color:var(--ink);font-weight:500}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.jump a{font:500 12px var(--mono);border-radius:999px;padding:5px 12px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.jump a b{color:var(--qc);margin-right:4px}
.notice{background:var(--bad-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:8px;align-items:center}

.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.full{grid-column:1/-1}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;min-width:0;display:flex;flex-direction:column;gap:16px;border-top:4px solid var(--qc);scroll-margin-top:12px}
[data-q="1"]{--qc:var(--q1)}[data-q="2"]{--qc:var(--q2)}[data-q="3"]{--qc:var(--q3)}[data-q="4"]{--qc:var(--q4)}
.quad>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quad>header .n{font:500 13px var(--mono);color:var(--qc)}
.quad h2{font-size:21px}
.quad>header .label{margin-left:auto}
.quad h3{font:600 11.5px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--qc);display:flex;align-items:center;gap:6px}
.quad h3 .i{width:15px;height:15px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--qc) 14%,transparent);color:var(--qc);flex:none}

/* 01 About */
.about{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.about{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;align-content:start;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.tile strong{display:block;font-size:12px;font-family:var(--mono);font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.linklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linklist a{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.linklist li:last-child a{border-bottom:0}
.linklist a:hover{text-decoration:none;color:var(--accent)}
.linklist .ico{width:28px;height:28px;border-radius:7px}
.linklist .ico .i{width:15px;height:15px}
.linklist .t{flex:1;min-width:0}
.linklist small{display:block;color:var(--muted);font-size:12px}
.linklist .go{color:var(--muted);width:14px;height:14px}
.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vid{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:10px;padding:10px;color:var(--ink);font-size:13px;line-height:1.35}
.vid:hover{text-decoration:none;outline:1px solid var(--qc)}
.vid .i{width:26px;height:26px;color:var(--bad)}
.vid small{color:var(--muted)}

/* 02 Journey map */
.jwrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 6px}
.jm{display:grid;grid-template-columns:150px repeat(var(--cols),minmax(128px,1fr));min-width:calc(150px + var(--cols) * 128px);font-size:13px}
.jm>div{padding:8px 8px;border-bottom:1px solid var(--line);min-width:0}
.jm .rl{position:sticky;left:0;background:var(--surface);z-index:2;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.jm .rl .i{width:15px;height:15px}
.stage{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.stage .ico{width:32px;height:32px;border-radius:50%}
.stage b{font:600 14px var(--display);line-height:1.15}
.time{font:11px var(--mono);color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.time .i{width:12px;height:12px}
.jm ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:2px}
.feel{grid-column:2/-1;position:relative;height:210px;padding:0!important}
.feel svg.curve{position:absolute;inset:24px 0 80px 0;width:100%;height:calc(100% - 104px);overflow:visible}
.feel .band{position:absolute;left:0;right:0;font:10px var(--mono);color:var(--muted);padding-left:4px}
.dot{position:absolute;transform:translate(-50%,-15px);display:flex;flex-direction:column;align-items:center;gap:2px;width:120px;text-align:center}
.face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--fc);color:var(--fc)}
.face .i{width:20px;height:20px}
.dot b{font:600 12px var(--body);color:var(--fc);background:var(--surface);padding:0 4px;border-radius:4px}
.quote{position:absolute;bottom:4px;transform:translateX(-50%);width:124px;text-align:center;font-style:italic;color:var(--muted);font-size:12px;line-height:1.3}
.pain{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-size:12.5px;line-height:1.35}
.pain .i{width:15px;height:15px;margin-top:1px}
.grp{grid-column:1/-1;background:var(--sunk);font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--qc);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;left:0}
.legend{display:inline-flex;gap:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.who{font:500 13px var(--body)!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important}
.who .i{width:16px!important;height:16px!important;color:var(--gc)}
.cell{position:relative;display:grid;place-items:center}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--gc);opacity:.18}
.cell.edge-l::before{left:50%}.cell.edge-r::before{right:50%}.cell.none::before{display:none}
.mk{width:14px;height:14px;border-radius:50%;position:relative;z-index:1;cursor:help}
.mk.L{background:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 22%,transparent)}
.mk.S{background:var(--surface);border:2.5px solid var(--gc)}
.g-patient{--gc:var(--q2)}.g-care{--gc:var(--q1)}.g-dx{--gc:var(--q4)}.g-sys{--gc:var(--q3)}

/* 03 Access */
.inf{display:flex;flex-direction:column}
.inf li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.inf li:last-child{border-bottom:0}
.inf .ico{grid-row:span 2}
.inf .top{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.inf strong{font-size:14px}
.lever{font:500 11px var(--mono);background:color-mix(in srgb,var(--qc) 13%,transparent);color:var(--qc);border-radius:4px;padding:2px 6px}
.inf .why{color:var(--muted);font-size:13px;display:flex;gap:4px;align-items:baseline}
.inf .why em{font-style:normal;color:var(--ink);font-size:12px;font-family:var(--mono)}
ul.plain{list-style:none;margin:0;padding:0}
.reality{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.reality li{display:flex;gap:8px;align-items:flex-start;background:var(--bad-soft);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35}
.reality .i{color:var(--bad);width:16px;height:16px;margin-top:1px}

/* 04 Innovations pipeline */
.pipe{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));align-items:center;font-size:13px}
.pipe>div{padding:8px 0;border-bottom:1px solid var(--line)}
.pipe .ph{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center}
.pipe .nm strong{display:block;font-size:13.5px;line-height:1.25}
.pipe .nm small{color:var(--muted);font-size:12px}
.bar{grid-column:2/-1;position:relative;height:30px}
.bar .fill{position:absolute;left:4%;top:50%;height:8px;transform:translateY(-50%);border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--qc) 25%,transparent),var(--qc))}
.bar .end{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--qc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--qc)}
.bar .end.ok{background:var(--good);box-shadow:0 0 0 1px var(--good)}
.beyond{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.beyond,.reality,.videos{grid-template-columns:minmax(0,1fr)}}
.beyond div{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.35}
.beyond strong{font-size:13px}
.beyond small{color:var(--muted)}
.beyond .i{color:var(--qc)}

/* Gaps + companies */
.wide{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;scroll-margin-top:12px}
.wide>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wide>header .label{margin-left:auto}
.wide h2{font-size:21px}
.gaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gap{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.4;min-width:0;--qc:var(--sev)}
.gap strong{display:block;font-size:14px;margin-bottom:2px}
.gap .sev{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sev)}
.gap[data-sev="high"]{--sev:var(--bad)}.gap[data-sev="med"]{--sev:var(--mid)}.gap[data-sev="low"]{--sev:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mini span{font:11px var(--mono);background:var(--sunk);border-radius:4px;padding:2px 6px;color:var(--muted)}
.co{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.company{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;min-width:0;--qc:var(--accent)}
.company strong{display:block;font-size:14.5px}
.company .type{font:11px var(--mono);color:var(--muted)}
.company p{margin:4px 0 0}
.foot{color:var(--muted);font-size:12px;margin-top:20px;display:flex;gap:6px;align-items:center}
/* search suggestions, directory, notes */
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(20,40,60,.14);list-style:none;margin:0;padding:6px;z-index:20;max-height:360px;overflow:auto;text-align:left}
.suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;color:var(--ink);font:14.5px var(--body);border-radius:8px;text-align:left;cursor:pointer}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--sunk)}
.suggest .cat{display:inline-flex;align-items:center;gap:5px;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.suggest .cat .i{width:13px;height:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:500 14px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.also{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}
.also .label{margin-right:4px}
.also .chip{font-size:13px;padding:4px 12px}
.srcnote{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.srcnote .i{color:var(--q2);margin-top:1px}
.srcnote b{color:var(--ink);font-weight:500}
.empty{display:flex;gap:8px;align-items:center;color:var(--muted);margin:0;font-size:13.5px}
.beyond a{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.35;color:var(--ink)}
.beyond a:hover{text-decoration:none;outline:1px solid var(--qc)}
.beyond a .i{color:var(--qc)}.beyond a small{color:var(--muted)}.beyond a strong{font-size:13px}
.mk.lg{display:inline-block;width:10px;height:10px;cursor:default}
.dirgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start}
.dircat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--qc);min-width:0}
.dircat header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dircat h2{font-size:17px}
.dircat header .label{margin-left:auto}
.dircat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dircat button{background:none;border:0;padding:5px 0;color:var(--ink);font:14px var(--body);cursor:pointer;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.dircat li:last-child button{border-bottom:0}
.dircat button:hover{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.quad,.wide{animation:rise .35s ease both}}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
</style>

<main>
  <section id="home">
    <div class="brand">Rare<span>·</span>Desk</div>
    <div class="tag" id="homeTag"></div>
    <form class="search" id="homeForm" role="search">
      <span data-i="search"></span>
      <input id="homeQ" type="search" placeholder="Search a rare disease, e.g. bronchiectasis" autocomplete="off" aria-label="Disease name" role="combobox" aria-controls="homeSug" aria-expanded="false">
      <button type="submit">Search</button>
      <ul class="suggest" id="homeSug" role="listbox" hidden></ul>
    </form>
    <div class="chips" id="homeChips"></div>
    <button type="button" class="linkbtn" id="browseLink">Browse all diseases</button>
  </section>

  <section id="results" hidden>
    <div class="topbar">
      <button class="brand" id="homeBtn" type="button">Rare<span>·</span>Desk</button>
      <form class="search" id="topForm" role="search">
        <span data-i="search"></span>
        <input id="topQ" type="search" autocomplete="off" aria-label="Disease name" role="combobox" aria-controls="topSug" aria-expanded="false">
        <button type="submit">Search</button>
        <ul class="suggest" id="topSug" role="listbox" hidden></ul>
      </form>
    </div>
    <div id="out"></div>
  </section>
</main>

<script src="data/diseases.js"></script>
<script src="data/journeys/immuno.js"></script>
<script src="data/journeys/inflam.js"></script>
<script src="data/journeys/metabolic-lysosomal.js"></script>
<script src="data/journeys/metabolic-other.js"></script>
<script src="data/journeys/neuro.js"></script>
<script src="data/journeys/blood.js"></script>
<script src="data/journeys/organ.js"></script>
<script src="data/journeys/endo-skin.js"></script>
<script src="data/journeys/liver-eye-syndrome.js"></script>
<script>
/* ===================== ICONS (inline, 24×24 stroke) ===================== */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',

  lifelong:["activity","Lifelong treatment burden","Ongoing infusions and monitoring","med",["Care team","Pharma"]],
  data:["db","Limited natural-history data","Small populations make trials hard","med",["Researchers","Registries"]],
  equity:["globe","Global access gap","Therapies rarely reach low/middle-income countries","low",["Pharma","Global health"]]
};
const ARCH_GAPS = {genetic:["delay","gene","transition","carer"], immune:["delay","awareness","experts","lifelong"], chronic:["delay","experts","data","equity"]};

/* ===================== SEARCH INDEX ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const slug = s => norm(s).replace(/ /g,"-");
function lev(a,b){ // edit distance, so typos like "brochiactasis" still match
  if(Math.abs(a.length-b.length)>4) return 99;
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const DIR = window.DIRECTORY || [];
const INDEX = [
  ...Object.entries(DISEASES).map(([k,d])=>({kind:"cur",key:k,name:d.name,cat:d.cat,terms:[d.name,...d.aliases].map(norm)})),
  ...DIR.map((e,i)=>({kind:"dir",key:i,name:e.n,cat:e.c,terms:[e.n,...(e.a||[])].map(norm)}))
];
function score(item,n){
  let best=0;
  for(const t of item.terms){
    if(t===n) return 100;
    const words=t.split(" ");
    if(t.startsWith(n) && n.length>=2) best=Math.max(best, n.length>=4?85:75);
    else if(words.some(w=>w.startsWith(n)) && n.length>=3) best=Math.max(best,70);
    else if(n.length>=5 && t.includes(n)) best=Math.max(best,62);
    else if(t.length>=4 && (" "+n+" ").includes(" "+t+" ")) best=Math.max(best,72);
    if(best<60 && t.length>4 && n.length>4){ const d=lev(n,t); if(d<=Math.max(2,Math.floor(t.length*.25))) best=Math.max(best,50-d); }
  }
  return best;
}
function rank(q){
  const n=norm(q); if(!n) return [];
  return INDEX.map(it=>({it,s:score(it,n)})).filter(x=>x.s>=40).sort((a,b)=>b.s-a.s||a.it.name.localeCompare(b.it.name));
}

function wireSearch(form,input,list){
  let sel=-1, items=[];
  const close=()=>{list.hidden=true; list.innerHTML=""; items=[]; sel=-1; input.setAttribute("aria-expanded","false");};
  const paint=()=>list.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-selected",i===sel));
  input.addEventListener("input",()=>{
    items=rank(input.value).slice(0,8);
    if(!items.length){ close(); return; }
    list.innerHTML=items.map(({it})=>`<li><button type="button" tabindex="-1" data-k="${it.kind}:${it.key}">${esc(it.name)}<span class="cat">${ic(CATS[it.cat]?.i||"target")}${esc(CATS[it.cat]?.l||"")}</span></button></li>`).join("");
    list.hidden=false; sel=-1; input.setAttribute("aria-expanded","true");
  });
  input.addEventListener("keydown",e=>{
    if(list.hidden) return;
    if(e.key==="ArrowDown"){e.preventDefault(); sel=Math.min(sel+1,items.length-1); paint();}
    else if(e.key==="ArrowUp"){e.preventDefault(); sel=Math.max(sel-1,-1); paint();}
    else if(e.key==="Escape"){close();}
  });
  list.addEventListener("mousedown",e=>e.preventDefault()); // keep focus so click registers
  list.addEventListener("click",e=>{const b=e.target.closest("button[data-k]"); if(b){close(); openItem(b.dataset.k);}});
  input.addEventListener("blur",()=>setTimeout(close,100));
  form.addEventListener("submit",e=>{e.preventDefault(); if(sel>=0&&items[sel]){const it=items[sel].it; close(); openItem(it.kind+":"+it.key);} else {close(); go(input.value);} });
}

});

function setHash(h){ try{ history.replaceState(null,"",h?"#"+h:location.pathname+location.search) }catch(_){} }
function showResults(){ $("#home").hidden=true; $("#results").hidden=false; window.scrollTo(0,0); }

function go(q){
  q=(q||"").trim(); if(!q) return;
  const r=rank(q);
  if(!r.length){ showResults(); $("#topQ").value=q; $("#out").innerHTML=renderGeneric(q); setHash(""); return; }
  const top=r[0].it, also=r.slice(1).filter(x=>x.s>=60).slice(0,6).map(x=>x.it);
  openItem(top.kind+":"+top.key, top.terms.includes(norm(q))?null:q, also);
}
function openItem(k, typed=null, also=[]){
  const [kind,key]=k.split(":");
  const d = kind==="cur" ? DISEASES[key] : fromDirectory(DIR[+key]);
  if(!d) return;

  setHash(slug(d.name));
}

/* ===================== DIRECTORY → PROFILE ===================== */
const PH = {A:3,F:2.6,"3":2,"2":1,"1":0};
const PHL = {A:"Approved",F:"Filed",["3"]:"Phase 3",["2"]:"Phase 2",["1"]:"Early"};
const NONCO = /centres|^various$|^generic$|consortia|academic/i;

const SEV={h:"high",m:"med",l:"low"};
function parseJourney(J){
  if(!J) return null;
  const stages=J.s.map(x=>{const [n,i,t,d,f,w,q,p]=x.split("|"); return {n,i,t,d:d.split(";"),f:+f,w,q,p};});
  const own=J.k.map(x=>x.split("|"));
  const stakeholders=own.some(r=>r[0]==="patient")?own:[["patient","Patient & family","user","L".repeat(stages.length),"Lives every stage"],...own];
  const gaps=J.gp.map(x=>{const [i,t,d,s,o]=x.split("|"); return [i,t,d,SEV[s]||"med",(o||"").split(";").filter(Boolean)];});
  return {stages,stakeholders,gaps};
}

function fromDirectory(e){
  const cat=CATS[e.c]||{l:"Rare disease",i:"target",j:"chronic"};
  const JS=parseJourney((window.JOURNEY_DATA||{})[e.n]);
  const arch=e.j||cat.j, J=JOURNEYS[arch];
  const lead=e.sp?.[0]||"Specialist", others=(e.sp||[]).slice(1).join(" · ");
  const rx=e.rx||[], approved=rx.filter(r=>r[2]==="A");
  const enc=encodeURIComponent(e.n);
  const gk=[...(approved.length?["cost"]:["notx"]), ...ARCH_GAPS[arch], ...(e.gx||[])];
  const gaps=(JS?JS.gaps:[...new Set(gk)].map(k=>GAPS[k])).sort((a,b)=>({high:0,med:1,low:2}[a[3]]-{high:0,med:1,low:2}[b[3]]));

  // one card per company, listing its therapies
  const cos=new Map();
  for(const [drug,cs,st] of rx) for(let c of cs.split(" · ")){
    c=c.replace(/ and biosimilars$| and others$/,"").trim(); if(NONCO.test(c)) continue;
    const m=cos.get(c)||{drugs:[],a:false}; m.drugs.push(drug.replace(/ \(.*\)$/,"")); m.a=m.a||st==="A"; cos.set(c,m);
  }
  const companies=[...cos].map(([c,m])=>["building",c,m.a?"Marketed therapy":"Pipeline",m.a?"Has an approved therapy":"Developing a therapy",m.drugs.slice(0,3)]);
  for(const o of (e.o||[])) companies.push(["users",o,"Organisation","Awareness, education, advocacy",["Awareness"]]);

  return {
    name:e.n, cat:e.c, profile:"directory", journeyLabel:J.label, specific:!!JS,
    aka:(e.a||[]).join(" · "),
    codes:[...(e.icd?[["ICD-10",e.icd]]:[]),["Type",cat.l]],
    quick:[[cat.i,"What",e.w],["dna","Cause",e.g],["users","How many",e.p],["scan","Diagnose",e.dx],["pill","Treat",e.tx],["steth","Specialists",(e.sp||[]).join(" · ")]],
    read:[
      ["book","Disease summary","Orphanet","https://www.orpha.net/en/disease/search?search="+enc],
      ["book","Patient overview","NIH GARD","https://rarediseases.info.nih.gov/search?term="+enc],
      ["users","Rare disease report","NORD","https://rarediseases.org/?s="+enc],
      ...(arch!=="chronic"?[["dna","Clinical genetics review","GeneReviews","https://www.ncbi.nlm.nih.gov/books/NBK1116/?term="+enc]]:[]),
      ["file","Latest reviews","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+enc+"&filter=pubt.review&sort=date"],
      ["file","Guidelines","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+enc+"&filter=pubt.guideline"]],
    watch:[
      [e.n+" explained","YouTube","https://www.youtube.com/results?search_query="+enc+"+explained"],
      ["Patient & family stories","YouTube","https://www.youtube.com/results?search_query="+enc+"+patient+story"],
      ["Treatment & research updates","YouTube","https://www.youtube.com/results?search_query="+enc+"+treatment+update"],
      ["Conference talks","YouTube","https://www.youtube.com/results?search_query="+enc+"+grand+rounds"]],
    stages:JS?JS.stages:J.stages,
    stakeholders:JS?JS.stakeholders:J.who(lead,others),
    influence:[
      ["landmark","Regulators","Approval & label","All eligible patients",approved.length?`${approved.length} approved option${approved.length>1?"s":""} listed`:"No approved therapy yet"],
      ["scale","HTA bodies","Value assessment","Publicly insured","Decide national funding"],
      ["coins","Payers","Coverage & prior auth","Insured patients",approved.length?"High-cost therapy needs justification":"Cover tests and supportive care"],
      ["hospital",lead+"s","Diagnosis & referral","Referred patients","Expertise in few centres"],
      ...(arch!=="chronic"?[["dna","Genetic testing policy","Test funding","Families","Diagnosis unlocks therapy & trials"]]:[]),
      ...((e.gx||[]).includes("nbs")?[["target","Newborn screening","Who is screened","Newborns","Early treatment changes outcomes"]]:[]),
      ["users",(e.o||["Patient organisations"])[0],"Advocacy & registries","Families","Shape HTA input and research"]],
    reality:gaps.filter(g=>g[3]!=="low").slice(0,4).map(g=>g[1]+": "+g[2].charAt(0).toLowerCase()+g[2].slice(1)),
    pipeline:rx.slice(0,8).map(([n,c,st,note])=>[n,c.split(" · ")[0],PH[st]??0,(PHL[st]||"")+(note?" · "+note:"")]),
    beyond:[
      ["flask","Recruiting trials","ClinicalTrials.gov","Find active studies","https://clinicaltrials.gov/search?cond="+enc+"&aggFilters=status:rec"],
      ["db","Registries","Search","Real-world data, natural history","https://www.google.com/search?q="+enc+"+patient+registry"],
      ["bulb","Research news","PubMed · last 2 yrs","Newest publications","https://pubmed.ncbi.nlm.nih.gov/?term="+enc+"&filter=datesearch.y_2"]],
    gaps,
    companies
  };
}

const ext = (u) => `href="${esc(u)}" target="_blank" rel="noopener"`;
const qhead = (n,title,extra="") => `<header><span class="n">${n}</span><h2>${title}</h2>${extra}</header>`;
const FEEL = f => f>=4?["happy","var(--good)"]:f===3?["neutral","var(--mid)"]:["sad","var(--bad)"];

function journeyMap(d){
  const S=d.stages, n=S.length, pct=i=>((i+.5)/n*100);
  const y=f=>(5-f)/4*100; // 5 at top, 1 at bottom (percent of curve box)
  const pts=S.map((s,i)=>`${pct(i)},${y(s.f)}`).join(" ");
  const groups={patient:"Patient",care:"Care team",dx:"Diagnostics & specialists",sys:"System & industry"};
  let rows="", last=null;
  const order={patient:0,care:1,dx:2,sys:3};
  for(const [g,name,icon,map,role] of [...d.stakeholders].sort((a,b)=>order[a[0]]-order[b[0]])){
    if(g!==last){ rows+=`<div class="grp g-${g}">${groups[g]}${last===null?`<span class="legend"><span><i class="mk L g-${g} lg"></i>Leads</span><span><i class="mk S g-${g} lg"></i>Supports</span></span>`:""}</div>`; last=g; }
    const on=[...map].map(c=>c!=="."); const first=on.indexOf(true), lastOn=on.lastIndexOf(true);
    rows+=`<div class="rl who g-${g}" title="${esc(role)}">${ic(icon)}${esc(name)}</div>`;
    rows+=[...map].map((c,i)=>{
      const cls = (i<first||i>lastOn)?"none":(i===first?"edge-l":"")+(i===lastOn?" edge-r":"");
      return `<div class="cell g-${g} ${cls}">${c==="."?"":`<span class="mk ${c}" title="${esc(name)} · ${c==="L"?"leads":"supports"} at ${esc(S[i].n)}"></span>`}</div>`;
    }).join("");
  }
  return `<div class="jwrap"><div class="jm" style="--cols:${n}">
    <div class="rl">${ic("route")}Stage</div>
    ${S.map(s=>`<div class="stage"><span class="ico">${ic(s.i)}</span><b>${esc(s.n)}</b><span class="time">${ic("clock")}${esc(s.t)}</span></div>`).join("")}
    <div class="rl">${ic("file")}What happens</div>
    ${S.map(s=>`<div><ul>${s.d.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
    <div class="rl">${ic("heart")}Patient feels</div>
    <div class="feel">
      <span class="band" style="top:4px">better</span><span class="band" style="bottom:62px">worse</span>
      <svg class="curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" x2="100" y1="50" y2="50" stroke="var(--line)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
        <polyline points="${pts}" fill="none" stroke="var(--q2)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      ${S.map((s,i)=>{const [f,c]=FEEL(s.f);return `<div class="dot" style="left:${pct(i)}%;top:calc(24px + (100% - 104px) * ${y(s.f)/100});--fc:${c}"><span class="face">${ic(f)}</span><b>${esc(s.w)}</b></div><div class="quote" style="left:${pct(i)}%">${esc(s.q)}</div>`}).join("")}
    </div>
    <div class="rl">${ic("alert")}Pain point</div>
    ${S.map(s=>`<div class="pain">${ic("alert")}<span>${esc(s.p)}</span></div>`).join("")}
    ${rows}
  </div></div>`;
}

function renderGeneric(q){
  const e=encodeURIComponent(q);
  const L=(i,t,s,u)=>`<li><a ${ext(u)}><span class="ico">${ic(i)}</span><span class="t">${esc(t)}<small>${esc(s)}</small></span>${ic("ext","go")}</a></li>`;
  return `
  <div class="notice">${ic("search")}“${esc(q)}” isn't in the directory yet. Live research links below, or <button type="button" class="linkbtn" id="toDir">browse the directory</button>.</div>
  <div class="head"><div><div class="label">Quick research</div><h1>${esc(q)}</h1></div></div>
  <div class="board">
    <article class="quad" data-q="1">${qhead("01","About the disease")}<ul class="linklist">
      ${L("book","Disease summary","Orphanet","https://www.orpha.net/en/disease/search?search="+e)}
      ${L("book","Overview","NIH GARD","https://rarediseases.info.nih.gov/search?term="+e)}
      ${L("file","Reviews","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"&filter=pubt.review")}
      ${L("play","Explainer videos","YouTube","https://www.youtube.com/results?search_query="+e+"+explained")}</ul></article>
    <article class="quad" data-q="2">${qhead("02","Patient journey &amp; stakeholders")}<ul class="linklist">
      ${L("route","Patient journey studies","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"+patient+journey")}
      ${L("users","Patient organisations","NORD","https://rarediseases.org/?s="+e)}
      ${L("file","Guidelines & care pathways","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"&filter=pubt.guideline")}</ul></article>
    <article class="quad" data-q="3">${qhead("03","Access &amp; reimbursement")}<ul class="linklist">
      ${L("scale","HTA guidance","NICE","https://www.nice.org.uk/search?q="+e)}
      ${L("coins","Cost & burden studies","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"+cost+OR+burden+OR+reimbursement")}
      ${L("landmark","Orphan designations","FDA","https://www.accessdata.fda.gov/scripts/opdlisting/oopd/")}</ul></article>
    <article class="quad" data-q="4">${qhead("04","Innovations")}<ul class="linklist">
      ${L("flask","Recruiting trials","ClinicalTrials.gov","https://clinicaltrials.gov/search?cond="+e+"&aggFilters=status:rec")}
      ${L("bulb","Latest research (2 yrs)","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"&filter=datesearch.y_2")}</ul></article>
  </div>
  <section class="wide"><header><h2>Gaps &amp; who is working on them</h2></header><ul class="linklist">
    ${L("target","Unmet-need literature","PubMed","https://pubmed.ncbi.nlm.nih.gov/?term="+e+"+unmet+need")}
    ${L("building","Industry-sponsored trials","ClinicalTrials.gov","https://clinicaltrials.gov/search?cond="+e+"&aggFilters=funderType:industry")}</ul></section>`;
}
document.addEventListener("click",e=>{ if(e.target.id==="toDir") showDirectory(); });

/* deep links: #bronchiectasis, #fabry-disease, #directory */
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h) return;
  if(h==="directory") return showDirectory();
  const it=INDEX.find(x=>slug(x.name)===h);
  it ? openItem(it.kind+":"+it.key) : go(h.replace(/-/g," "));
}
fromHash();
window.addEventListener("hashchange",fromHash);
</script>
